services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: fdi
      POSTGRES_PASSWORD: fdi_local_password
      POSTGRES_DB: fdi

    volumes:
      - fdi_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U fdi -d fdi
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .

    command:
      - sh
      - -c
      - >
        alembic upgrade head &&
        python -m uvicorn app.main:app
        --host 0.0.0.0
        --port 8000

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://fdi:fdi_local_password@db:5432/fdi
      APP_ENV: production

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health'
          ).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ui:
    build:
      context: .

    command:
      - streamlit
      - run
      - ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

    environment:
      FDI_API_BASE_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_healthy


volumes:
  fdi_postgres_data: